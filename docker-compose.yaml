services:
  db:
    image: mariadb:lts
    container_name: wordpress_db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      wp_prod_net:
        ipv4_address: ${DB_STATIC_IP}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost');
        define('WP_SITEURL', 'http://localhost');
    ports:
      - "80:80"
    volumes:
      - ./wp_data:/var/www/html
    networks:
      wp_prod_net:
        ipv4_address: ${WP_STATIC_IP}

  wp-cli:
    image: wordpress:cli
    container_name: wordpress_cli
    volumes:
      - ./wp_data:/var/www/html
    networks:
      wp_prod_net:
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    command: >
      sh -c "
      sleep 10;
      wp language core install pt_BR --activate;
      wp option update timezone_string 'America/Fortaleza';
      "

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wordpress_pma
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    networks:
      wp_prod_net:
        ipv4_address: ${PMA_STATIC_IP}

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: wordpress_code_server
    restart: always
    environment:
      - PUID=33
      - PGID=33
      - TZ=America/Fortaleza
      - PASSWORD=${CODE_PASSWORD}
      - DEFAULT_WORKSPACE=/config/workspace/wp-content
      - DOCKER_MODS=linuxserver/mods:code-server-extension-arguments
      - VSCODE_EXTENSION_IDS=bmewburn.vscode-intelephense-client
      - SHELL=/bin/bash
      - SUDO_PASSWORD=${CODE_PASSWORD} # Usa a mesma senha do ambiente para o sudo
    ports:
      - "8443:8443"
    volumes:
      - ./wp_data:/config/workspace
      - ./install-tools.sh:/custom-cont-init.d/install-tools.sh:ro
    networks:
      wp_prod_net:
        ipv4_address: ${CODE_STATIC_IP}

networks:
  wp_prod_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET_IP}
